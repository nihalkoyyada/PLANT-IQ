name: PlantIQ CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: plantiq
          POSTGRES_USER: plantiq
          POSTGRES_PASSWORD: plantiq_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations against TimescaleDB
        env:
          DATABASE_URL: postgresql+psycopg://plantiq:plantiq_dev_password@localhost:5432/plantiq
        run: |
          cd backend
          alembic upgrade head
          alembic current

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://plantiq:plantiq_dev_password@localhost:5432/plantiq
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          JWT_SECRET: dev_secret_key_change_in_production
        run: |
          cd backend
          pytest tests/api tests/ai/test_daylight_coverage.py tests/ai/test_file_profiler.py tests/ai/test_ingest_worker.py tests/ai/test_job_history.py tests/ai/test_kpi_engine.py tests/ai/test_mapping_suggester.py

  frontend-checks:
    name: Frontend TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Compiler Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Frontend Production Asset
        run: |
          cd frontend
          npm run build
